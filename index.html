<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f1f5f9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ローマ字うち" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="スマホで遊べるローマ字入力練習ゲームです。流れる日本語とローマ字を、画面いっぱいのキーボードで入力して練習できます。" />
  <meta property="og:title" content="ローマ字うち" />
  <meta property="og:description" content="スマホで遊べるローマ字入力練習ゲーム。流れるテキストを時間内に入力して、連続正解記録を伸ばそう。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ja_JP" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <title>ローマ字うち</title>
</head>

<body>
  <div class="app">
    <main>
      <section class="prompt-line" id="textLane">
        <div class="moving-text" id="movingText">
          <div class="japanese" id="japanese">さくら</div>
          <div class="romaji-target" id="romajiTarget">sakura</div>
        </div>
        <div class="score-mask" id="scoreMask"></div>
        <div class="score-board">
          <div class="score-pill"><span class="score-icon">🔥</span><span id="streakCount">0</span></div>
          <div class="score-pill"><span class="score-icon">🏆</span><span id="bestCount">0</span></div>
        </div>
      </section>

      <section class="keyboard-wrap">
        <div class="rotate-hint" aria-hidden="true">
          <div class="rotate-icon-row">📱 → <span class="rotated-phone-icon">📱</span></div>
          <div>よこに ながくすると<br>あそびやすいよ</div>
        </div>
        <div class="keyboard" id="keyboard" aria-label="ローマ字キーボード"></div>
      </section>
    </main>
  </div>

  <script src="./assets/js/app.js" defer></script>
</body>

</html>
